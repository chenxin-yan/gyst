packages:
  - apps/*
  - packages/*

catalog:
  # One version for every Effect package, as upstream requires: platform-node's ^ range on platform-node-shared admits newer releases that raise the effect peer floor.
  "@effect/platform-node": 4.1.1
  "@effect/platform-node-shared": 4.1.1
  "@pierre/diffs": 1.6.2
  "@pierre/trees": 1.0.0-beta.6
  effect: 4.1.1
  # Managed by `vp migrate`: Vite+ replaces Vite and pins the Vitest it drives.
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
