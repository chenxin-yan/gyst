name: check

on:
  pull_request:
  # release.yml runs this on main before versioning or publishing.
  workflow_call:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # Minimum and current supported Node 24 runtimes.
        node-version: ["24.11.0", "24"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm pack ./apps/gyst/stage --dry-run
