name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: chenxin-yan/crust
          ref: 38e7298954c60ec0a45dcfa830b515b2bc32ece0
          path: crust
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build local crust dependency
        working-directory: crust
        run: |
          bun install --frozen-lockfile
          bunx turbo run build --filter=@crustjs/core --filter=@crustjs/extensions
      - name: Link local crust dependency
        env:
          CRUST_CHECKOUT: ${{ github.workspace }}/crust
        run: bun run setup:crust
      - run: bun install --frozen-lockfile
      - run: bun run check
