name: release

# Changesets flow: a merged PR carrying a changeset opens or updates the "Version Packages" PR;
# merging that PR publishes. Versions move only through that PR, so main is the release source.
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Reset at the top; each job declares what it needs. Only `publish` gets id-token: write.
permissions: {}

jobs:
  check:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  select-mode:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump
      pull-requests: write # open or update the release PR
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - uses: changesets/action/version@v2
        with:
          pr-title: "chore: release @gyst/cli"
          commit-message: "chore: version packages"
          script: npm run release:version

  publish:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # git tags, GitHub release and its assets
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          # `changeset git-tag` needs existing tags to skip already-tagged versions.
          fetch-depth: 0
          persist-credentials: false
      # npm >= 11.5.1 for trusted publishing; Node 24 bundles it. No token, no .npmrc: the
      # published package needs a trusted publisher on npmjs.com for chenxin-yan/gyst + release.yml.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Build and stage @gyst/cli
        run: npm run build
      - name: Verify the staged package contents without network writes
        run: npm pack ./apps/gyst/stage --dry-run
      - name: Publish @gyst/cli, then tag and release
        id: publish
        uses: changesets/action/publish@v2
        with:
          script: npm run release:publish
      - name: Attach the skills archive to the GitHub release
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.publish.outputs.published-packages }}
        run: |
          tar -C apps/gyst/.crust/root -czf apps/gyst/.crust/gyst-skills.tar.gz skills
          version=$(jq -r '.[] | select(.name == "@gyst/cli") | .version' <<<"$PUBLISHED")
          gh release upload "@gyst/cli@$version" --clobber \
            LICENSE \
            apps/gyst/.crust/gyst-skills.tar.gz
